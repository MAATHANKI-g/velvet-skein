<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add product | The Velvet Skein admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { padding: 48px 20px; }
    .admin-card {
      max-width: 560px; margin: 0 auto; background: #fff; border-radius: 20px;
      padding: 32px; box-shadow: 0 20px 40px -8px rgba(58,46,43,.08);
    }
    .admin-card h1 { font-size: 28px; margin-bottom: 4px; }
    .admin-card > p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .check { flex-direction: row !important; align-items: center; gap: 8px !important; }
    .status { font-size: 14px; min-height: 20px; margin-top: 8px; }
    .ok { color: var(--sage); } .err { color: var(--rose); }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="admin-card">
    <h1>Add a product</h1>
    <p>Only you should see this page. Enter the admin key from your server settings.</p>

    <form id="product-form" class="stack">
      <label>Admin key
        <input name="adminKey" type="password" required autocomplete="off">
      </label>

      <label>Product name
        <input name="name" required maxlength="120" placeholder="e.g. Sunny Desk Sunflower">
      </label>

      <label>Description
        <textarea name="description" rows="3" maxlength="500" placeholder="One or two lines for the card"></textarea>
      </label>

      <div class="row">
        <label>Price (₹)
          <input name="price" type="number" min="0" step="1" required placeholder="150">
        </label>
        <label>Stock (pieces)
          <input name="stock" type="number" min="0" step="1" required placeholder="10">
        </label>
      </div>

      <div class="row">
        <label>Category
          <input name="category" maxlength="60" placeholder="Forever Flowers">
        </label>
        <label>Image path or URL
          <input name="image_url" maxlength="300" placeholder="assets/product-sunflower.jpg">
        </label>
      </div>

      <label class="check">
        <input name="is_featured" type="checkbox" checked>
        Show in Small Batch Bestsellers
      </label>

      <button class="btn btn-rose btn-block" type="submit">Add product</button>
      <p class="status" id="status" role="status"></p>
    </form>
  </div>

<script>
  const form = document.getElementById('product-form');
  const status = document.getElementById('status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = {
      name: fd.get('name'),
      description: fd.get('description'),
      price: fd.get('price'),
      stock: fd.get('stock'),
      category: fd.get('category'),
      image_url: fd.get('image_url'),
      is_featured: fd.get('is_featured') === 'on',
    };

    status.className = 'status';
    status.textContent = 'Saving…';

    try {
      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': fd.get('adminKey') },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not save');

      status.className = 'status ok';
      status.textContent = `Saved "${data.name}" (ID ${data.id}).`;
      const keep = fd.get('adminKey');
      form.reset();
      form.adminKey.value = keep; // keep the key for the next product
    } catch (err) {
      status.className = 'status err';
      status.textContent = err.message;
    }
  });
</script>
</body>
</html>
